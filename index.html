<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Chart.js Dashboard</title>

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #cad9e7;
            color: #333;
        }

        header {
            background: #1e293b;
            color: white;
            padding: 15px 30px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }

        .navbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            display: flex;
            align-items: center;
            font-size: 22px;
            font-weight: bold;
        }

        .logo-anim {
            display: inline-block;
            animation: technova-spin 2.5s cubic-bezier(0.68, -0.55, 0.27, 1.55) infinite;
        }

        @keyframes technova-spin {
            0% { transform: rotate(0deg) scale(1); }
            60% { transform: rotate(360deg) scale(1.15); }
            80% { transform: rotate(340deg) scale(0.95); }
            100% { transform: rotate(360deg) scale(1); }
        } 

        .logo {
            font-size: 22px;
            font-weight: bold;
        }

        .nav-links a {
            color: white;
            text-decoration: none;
            margin-left: 20px;
            font-size: 15px;
            transition: 0.3s;
        }

        .nav-links a:hover {
            color: #38bdf8;
        }

        .container {
            max-width: 1100px;
            margin: 40px auto;
            padding: 20px;
        }

        .card {
            background: white;
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 30px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.08);
        }

        .card h2 {
            margin-bottom: 15px;
            font-size: 20px;
            color: #1e293b;
        }

        canvas {
            max-width: 100%;
        }

        .grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }

        @media (max-width: 768px) {
            .grid {
                grid-template-columns: 1fr;
            }

            .nav-links {
                display: none;
            }
        }
    </style>
</head>

<body>

    <header>
        <div class="navbar">
            <div class="logo">
                <span class="logo-anim">
                    <!-- Technova SVG Logo Placeholder -->
                    <svg width="36" height="36" viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <circle cx="24" cy="24" r="20" fill="#38bdf8"/>
                        <text x="24" y="30" text-anchor="middle" font-size="18" fill="#fff" font-family="Segoe UI, Arial" font-weight="bold">T</text>
                    </svg>
                </span>
                <span style="margin-left:10px;vertical-align:middle;">Technova</span>
            </div>
            <div class="nav-links">
                <a href="#">Home</a>
                <a href="#">Analytics</a>
                <a href="#">Reports</a>
                <a href="#">Contact</a>
            </div>
        </div>
    </header>

    <div class="container">

        <div class="card">
            <h2>Line Chart</h2>
            <canvas id="myChart1"></canvas>
        </div>

        <div class="grid">
            <div class="card">
                <h2>Bar Chart</h2>
                <canvas id="myChart2"></canvas>
            </div>

            <div class="card">
                <h2>Pie Chart</h2>
                <canvas id="myChart3"></canvas>
            </div>
        </div>

    </div>

    <script>
        const ctx1 = document.getElementById('myChart1');
        const ctx2 = document.getElementById('myChart2');
        const ctx3 = document.getElementById('myChart3');

        const months = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun'];
        const revenue = [50000, 60000, 55000, 70000, 75000, 80000];
        const expenses = [30000, 35000, 32000, 40000, 42000, 45000];
        const profit = [20000, 25000, 23000, 30000, 33000, 35000];

        new Chart(ctx1, {
            type: 'line',
            data: {
                labels: months,
                datasets: [
                    {
                        label: 'Revenue',
                        data: revenue,
                        borderColor: 'blue',
                        fill: false
                    },
                    {
                        label: 'Expenses',
                        data: expenses,
                        borderColor: 'red',
                        fill: false
                    },
                    {
                        label: 'Profit',
                        data: profit,
                        borderColor: 'green',
                        fill: false
                    }
                ]
            },
            options: {
                plugins: {
                    legend: {
                        position: 'bottom'
                    }
                }
            }
        });

        new Chart(ctx2, {
            type: 'bar',
            data: {
                labels: months,
                datasets: [{
                    label: 'Revenue',
                    data: revenue,
                    backgroundColor: 'blue'
                }]
            },
            options: {
                plugins: {
                    legend: {
                        position: 'bottom'
                    }
                }
            }
        });

        new Chart(ctx3, {
            type: 'pie',
            data: {
                labels: ['Reinvestment 40%', 'Salary 35%', 'Miscelleneous 25%'],
                datasets: [{
                    data: [40, 35, 25],
                    backgroundColor: ['blue', 'red', 'green']
                }]
            },
            options: {
                plugins: {
                    legend: {
                        position: 'bottom'
                    }
                }
            }
        });
    </script>

</body>

</html>
